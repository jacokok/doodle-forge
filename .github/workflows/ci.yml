name: foundation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  typescript:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.7
      - uses: actions/setup-node@v4
        with:
          node-version: 26.12.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm build
      - run: pnpm test:smoke
      - run: pnpm db:generate && test -z "$(git status --porcelain -- packages/database/migrations)"
  browser:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.7
      - uses: actions/setup-node@v4
        with:
          node-version: 26.12.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: test-results/
  godot:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26.12.1
      - uses: actions/cache@v4
        id: engine-cache
        with:
          path: ~/.local/share/doodleforge-godot
          key: godot-4.7.2-stable-linux-x86-64-v1
      - name: Install pinned engine and matching templates
        if: steps.engine-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          destination="$HOME/.local/share/doodleforge-godot"
          mkdir -p "$destination"
          cd "$RUNNER_TEMP"
          base=https://github.com/godotengine/godot/releases/download/4.7.2-stable
          for name in Godot_v4.7.2-stable_linux.x86_64.zip Godot_v4.7.2-stable_export_templates.tpz SHA512-SUMS.txt; do
            curl -fLsS --retry 3 --max-time 600 "$base/$name" -o "$name"
          done
          grep -E '  Godot_v4\.7\.2-stable_(linux\.x86_64\.zip|export_templates\.tpz)$' SHA512-SUMS.txt > selected-checksums.txt
          test "$(wc -l < selected-checksums.txt)" -eq 2
          sha512sum -c selected-checksums.txt
          unzip -j Godot_v4.7.2-stable_linux.x86_64.zip -d "$destination"
          mkdir -p "$destination/templates"
          unzip -j Godot_v4.7.2-stable_export_templates.tpz templates/version.txt templates/linux_debug.x86_64 templates/linux_release.x86_64 -d "$destination/templates"
          chmod +x "$destination"/Godot* "$destination"/templates/linux*.x86_64
      - name: Headless engine assertions
        run: node tools/godot-validation/run.mjs
        env:
          GODOT_BIN: /home/runner/.local/share/doodleforge-godot/Godot_v4.7.2-stable_linux.x86_64
          GODOT_TEMPLATE_DIR: /home/runner/.local/share/doodleforge-godot/templates
